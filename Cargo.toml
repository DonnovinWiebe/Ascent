[workspace]
resolver = "3"
members = ["src/desktop", "src/nexus"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
schrod = "1.1.4"
materialui = { version = "4.1.0", features = ["plotters"] }
rusty-money = "0.5.0"
rust_decimal = "1.42"
serde = "1.0.229"
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
slip44 = "0.1.4"
dirs = "6.0.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs"] }
rayon = "1.12.0"
rand = "0.10.2"