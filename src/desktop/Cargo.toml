[package]
name = "ascent-desktop"
version = "1.0.0"
edition.workspace = true

[package.metadata.bundle]
name = "Ascent"
identifier = "dev.donnovinwiebe.ascent-desktop"
icon = ["assets/icon.icns"]
version = "1.0.0"
copyright = "Copyright (c) 2026 Donnovin Wiebe"
category = "public.app-category.finance"
short_description = "A tag driven personal finance tracker."
osx_minimum_system_version = "11.0"

[dependencies]
nexus = { path = "../nexus" }
rusty-money.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
slip44.workspace = true
iced = { version = "0.14.0", features = ["advanced", "canvas", "image"] }
tokio.workspace = true
rust_decimal_macros = "1.40"
iced_font_awesome = "0.4.2"
rand.workspace = true
tiny-skia = "0.12.0"
rayon.workspace = true
rfd = "0.17.2"
plotters = { version = "0.3", default-features = false, features = ["line_series", "ttf"] }
plotters-bitmap = "0.3.7"
materialui.workspace = true
schrod.workspace = true
dirs.workspace = true

[build-dependencies]
winresource = "0.1"