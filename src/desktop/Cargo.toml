[package]
name = "ascent"
version = "1.0.0"
edition.workspace = true

[package.metadata.bundle]
name = "Ascent"
identifier = "dev.donnovinwiebe.ascent"
icon = ["assets/icon.icns"]
version = "1.0.0"
copyright = "Copyright (c) 2026 Donnovin Wiebe"
category = "public.app-category.finance"
short_description = "A tag driven personal finance tracker."
osx_minimum_system_version = "11.0"

[dependencies]
nexus = { path = "../nexus" }
rusty-money.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
slip44.workspace = true
iced = { version = "0.14.0", features = ["advanced", "canvas", "image"] }
tokio = "1.53.1"
rust_decimal_macros = "1.40"
iced_font_awesome = "0.4.2"
rand = "0.10.2"
tiny-skia = "0.12.0"
rayon = "1.12.0"
rfd = "0.17.2"
plotters = { version = "0.3", default-features = false, features = ["line_series", "ttf"] }
plotters-bitmap = "0.3.7"
materialui = { version = "4.1.0", features = ["plotters"] }
schrod = "1.1.4"
dirs = "6.0.0"

[build-dependencies]
winresource = "0.1"